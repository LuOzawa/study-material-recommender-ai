[project]
name = "study-ai-service"
version = "1.0.0"
description = "LangGraph + vLLM + pgvector intelligent service for the study material recommender"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115,<1.0",
    "uvicorn[standard]>=0.32,<1.0",
    "pydantic>=2.9,<3.0",
    "pydantic-settings>=2.6,<3.0",
    "httpx>=0.27,<1.0",
    "openai>=1.55,<3.0",
    "asyncpg>=0.30,<1.0",
    "langgraph>=0.2.60,<2.0",
    "langchain-core>=0.3,<2.0",
]

[dependency-groups]
dev = [
    "pytest>=8.3,<9.0",
    "pytest-asyncio>=0.24,<1.0",
    "pgserver>=0.1.4,<0.2",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
markers = [
    "integration: requires a reachable PostgreSQL with the pgvector extension",
]
filterwarnings = [
    "ignore::DeprecationWarning:langgraph.*",
]

[tool.uv]
package = false
