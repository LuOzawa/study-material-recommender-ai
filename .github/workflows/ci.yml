name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend (Java 17)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: maven
      - name: Test
        run: mvn -B test
      - name: Package
        run: mvn -B -q -DskipTests package
  frontend:
    name: Frontend (Node 20)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install
        run: npm ci
      - name: Build
        run: npm run build
  python:
    name: Python
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -r recommendation/requirements.txt
  ai-service:
    name: AI service (FastAPI + LangGraph + pgvector)
    runs-on: ubuntu-latest
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: study_ai
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d study_ai"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    defaults:
      run:
        working-directory: ai-service
    env:
      TEST_DATABASE_URL: postgresql://postgres:postgres@localhost:5432/study_ai
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install uv
        run: pip install uv
      - name: Sync dependencies
        run: uv sync --frozen
      - name: Test
        run: uv run pytest -q
      - name: End-to-end smoke
        run: uv run python scripts/smoke_e2e.py
  postgres-schema:
    name: PostgreSQL schema (pgvector)
    runs-on: ubuntu-latest
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: recommend_db
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d recommend_db"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - name: Apply schema and seed
        env:
          PGPASSWORD: postgres
        run: |
          psql -h localhost -U postgres -d recommend_db -v ON_ERROR_STOP=1 -f sql/init.sql
          test "$(psql -h localhost -U postgres -d recommend_db -tAc 'select count(*) from materials')" = "31"
          test "$(psql -h localhost -U postgres -d recommend_db -tAc 'select count(*) from users')" = "4"
      - name: Guard identity and case-insensitive uniqueness
        env:
          PGPASSWORD: postgres
        run: |
          test "$(psql -h localhost -U postgres -d recommend_db -tAc "insert into categories (name) values ('CI') returning id" | head -1)" = "12"
          psql -h localhost -U postgres -d recommend_db -c "insert into users (username,password) values ('CaseUser','x')"
          if psql -h localhost -U postgres -d recommend_db -c "insert into users (username,password) values ('caseuser','x')"; then
            echo "case-insensitive unique index is missing" >&2
            exit 1
          fi
